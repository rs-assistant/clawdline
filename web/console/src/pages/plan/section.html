
    <div class="plan-shell">
        <div class="plan-heading">
            <div>
                <h1 id="plan-title" tabindex="-1">Plans and pricing</h1>
                <p class="plan-lede" id="plan-lede">Local work is always free. A plan only covers Cloud.</p>
            </div>
            <button class="plan-close" id="plan-close" type="button" data-page-to="sessions">Sessions</button>
        </div>

        <!-- The copied module still writes the tier, its note, the limits table and
             the provisional line. The two cards below say all of that, so these stay
             in the document for the module and out of sight. -->
        <div class="plan-legacy" hidden>
            <strong class="plan-tier" id="plan-tier">Free</strong>
            <p class="plan-tier-note" id="plan-tier-note"></p>
            <h2 class="plan-includes" id="plan-includes">What this plan includes</h2>
            <dl class="plan-limits" id="plan-limits" hidden></dl>
            <p class="plan-fine" id="plan-fine" hidden></p>
        </div>

        <div class="plan-offers">
            <article class="plan-offer plan-offer-pro" id="plan-offer-pro" data-current="false">
                <span class="plan-offer-tag" id="plan-offer-pro-tag">Recommended</span>
                <div class="plan-offer-top">
                    <h2 class="plan-offer-name">Pro</h2>
                    <span class="plan-offer-active" id="plan-offer-pro-active" hidden>Active</span>
                </div>
                <p class="plan-offer-price"><span class="plan-offer-amount">$10</span><span class="plan-offer-per" id="plan-offer-pro-per">/ month</span></p>
                <p class="plan-offer-pitch" id="plan-offer-pro-pitch"></p>
                <ul class="plan-offer-features" id="plan-offer-pro-features"></ul>
                <p class="plan-say" id="plan-say" role="status" aria-live="polite" hidden></p>
                <p class="plan-alert" id="plan-alert" role="alert" hidden></p>
                <div class="plan-actions">
                    <button class="plan-go" id="plan-upgrade" type="button" hidden>Upgrade to Pro</button>
                    <button class="plan-alt" id="plan-portal" type="button" hidden>Manage subscription</button>
                    <button class="plan-go" id="plan-signin" type="button" hidden>Continue with GitHub</button>
                    <button class="plan-alt" id="plan-retry" type="button" hidden>Try again</button>
                    <button class="plan-alt" id="plan-recheck" type="button" hidden>Check again</button>
                </div>
                <!-- Only on the copy of this page a machine serves, where there is no Cloud
                     account to charge and saying so is the honest answer rather than a broken one. -->
                <p class="plan-elsewhere" id="plan-elsewhere" hidden></p>
                <p class="plan-elsewhere-link"><a id="plan-console" href="https://app.clawdline.com/#page=plan">app.clawdline.com</a></p>
            </article>

            <article class="plan-offer plan-offer-free" id="plan-offer-free" data-current="false">
                <div class="plan-offer-top">
                    <h2 class="plan-offer-name">Free</h2>
                    <span class="plan-offer-current" id="plan-offer-free-current" hidden>Current plan</span>
                </div>
                <p class="plan-offer-price"><span class="plan-offer-amount">$0</span></p>
                <p class="plan-offer-pitch" id="plan-offer-free-pitch"></p>
                <ul class="plan-offer-features" id="plan-offer-free-features"></ul>
            </article>
        </div>

        <section class="plan-promo" aria-labelledby="plan-promo-title">
            <h2 id="plan-promo-title">Redeem a Cloud Pro offer</h2>
            <form id="plan-promo-form">
                <label id="plan-promo-label" for="plan-promo-code">Official redemption code</label>
                <div class="plan-promo-entry">
                    <input id="plan-promo-code" name="code" type="text" autocomplete="off" spellcheck="false" required maxlength="200" />
                    <button class="plan-go" id="plan-promo-submit" type="submit">Redeem</button>
                </div>
            </form>
            <p id="plan-promo-message" role="status" aria-live="polite"></p>
            <a id="plan-promo-cloud" href="https://app.clawdline.com/#page=plan" hidden>app.clawdline.com</a>
        </section>

        <p class="plan-offer-fine" id="plan-offer-fine"></p>

        <section class="plan-simulation" id="plan-simulation" hidden>
            <h2 id="plan-simulation-title">SuperUser plan simulation</h2>
            <dl class="plan-limits" id="plan-simulation-values"></dl>
            <div class="plan-actions">
                <button class="plan-alt" id="plan-simulation-actual" type="button">Actual</button>
                <button class="plan-alt" id="plan-simulation-free" type="button">Free</button>
                <button class="plan-alt" id="plan-simulation-pro" type="button">Pro</button>
            </div>
        </section>
    </div>
