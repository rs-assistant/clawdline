<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>連線健康 · 設計原型</title>
<!--
  Connection health — a standalone design prototype for the hosted console's /admin.
  Illustrative, deterministic fixtures only: nothing here reads a live source.
  Tokens are copied from web/console/src/legacy/tokens.css (dark only, on purpose) and the
  shell, tiles, panels and tables follow web/console/src/cloud/admin/admin.css.
  The design rationale is docs/admin-connection-health-design.md.
-->
<style>
:root {
  --bg: #0e0e11; --card: #16161a; --card-hi: #1c1c22; --line: #24242b;
  --ink: #e8e6e3; --dim: #9a978f; --faint: #6d6a64;
  --accent: #d97757; --accent-in: rgba(217, 119, 87, .13); --accent-ed: rgba(217, 119, 87, .34);
  --warn: #b08a4a; --bad: #a3564a;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
  --radius: 11px; --ease: cubic-bezier(.2, .7, .2, 1);
  /* Admin-local, as in admin.css .adm */
  --adm-chart: #a39283; --adm-link: #eca080;
  /* Health lanes (proposal): the healthy bar is a quiet grey so that nothing healthy outranks a block. */
  --lane-ok: #4a4852; --lane-unknown: #6d6a64;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); }
body { min-height: 100dvh; overflow-x: hidden; }
a { color: var(--adm-link); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1:focus, h2:focus { outline: none; }
h1:focus-visible { outline: 2px solid var(--accent); }

/* ---- prototype label: always on screen ---------------------------------- */
.proto {
  position: sticky; top: 0; z-index: 70;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 12px;
  padding: 7px 12px; background: var(--accent); color: #1a1310;
  font-size: 13px; font-weight: 650; text-align: center;
}
.proto button { min-height: 32px; padding: 0 10px; border-radius: 7px; border: 1px solid rgba(26, 19, 16, .45); background: transparent; color: #1a1310; font: inherit; font-weight: 600; cursor: pointer; }
.proto button:hover { background: rgba(26, 19, 16, .12); }
.proto button:focus-visible { outline: 2px solid #1a1310; }

/* ---- shell (admin.css .adm-shell) ---------------------------------------- */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: calc(100dvh - 46px); }
.side { display: flex; flex-direction: column; gap: 18px; padding: 18px 14px; background: var(--card); border-right: 1px solid var(--line); }
.brand { padding: 0 6px; }
.brand small { display: block; color: var(--dim); font-size: 12px; }
.brand strong { font-size: 16px; font-weight: 640; }
.nav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.nav a, .nav span.off { display: grid; gap: 1px; min-height: 52px; padding: 8px 10px; border-radius: 10px; color: var(--dim); text-decoration: none; align-content: center; }
.nav a:hover { background: var(--card-hi); color: var(--ink); }
.nav .on { background: var(--accent-in); color: var(--ink); box-shadow: 0 0 0 1px var(--accent-ed); }
.nav b { font-size: 14.5px; font-weight: 560; }
.nav .on b { font-weight: 640; }
.nav small { font-size: 12px; color: var(--dim); }
.side-foot { margin-top: auto; padding: 14px 6px 0; border-top: 1px solid var(--line); color: var(--dim); font-size: 12.5px; line-height: 1.5; }
.top { display: none; }
.content { min-width: 0; }
.main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 56px; display: grid; gap: 22px; min-width: 0; }
.scrim { display: none; }

/* ---- page head and controls --------------------------------------------- */
.crumbs { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 13px; color: var(--dim); margin: 0; padding: 0; list-style: none; }
.crumbs a { display: inline-flex; align-items: center; min-height: 32px; padding: 0 6px; border-radius: 6px; color: var(--adm-link); text-decoration: none; }
.crumbs a:hover { background: var(--accent-in); color: var(--ink); }
.pagehead { display: grid; gap: 4px; }
.pagehead h1 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -.01em; line-height: 1.15; }
.sub { margin: 0; color: var(--dim); font-size: 13.5px; line-height: 1.5; max-width: 72ch; }
.controls { display: grid; gap: 12px; padding: 14px 16px; border: 1px solid var(--accent-ed); border-radius: var(--radius); background: var(--accent-in); }
.controls-row { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-end; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span, fieldset legend { font-size: 12px; color: var(--dim); font-weight: 560; }
select { min-height: 40px; max-width: 100%; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 14px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line); border-radius: 9px; background: var(--card); overflow: hidden; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: inline-flex; align-items: center; min-height: 38px; padding: 0 12px; font-size: 13.5px; color: var(--dim); border-left: 1px solid var(--line); }
.seg label:first-child span { border-left: 0; }
.seg input:checked + span { background: var(--accent-in); color: var(--ink); font-weight: 620; box-shadow: inset 0 -2px var(--accent); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
.seg input:hover + span { color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); color: var(--ink); font: inherit; font-size: 14px; font-weight: 560; cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--card-hi); border-color: var(--accent-ed); }
.btn:active { transform: translateY(1px); }
.btn[aria-pressed="true"] { border-color: var(--accent-ed); }
.btn-small { min-height: 34px; padding: 0 12px; font-size: 13px; }
.live-note { margin: 0; font-size: 12.5px; color: var(--dim); line-height: 1.5; }
.notice { margin: 0; padding: 10px 14px; border-radius: 9px; border: 1px solid rgba(176, 138, 74, .45); background: rgba(176, 138, 74, .1); font-size: 13.5px; line-height: 1.5; }

/* ---- sections, panels, tiles (admin.css) --------------------------------- */
.section { display: grid; gap: 12px; min-width: 0; }
.h2 { margin: 0; font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.h3 { margin: 0; font-size: 15px; font-weight: 620; }
.panel { min-width: 0; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; margin-bottom: 10px; }
.fine { margin: 0; color: var(--dim); font-size: 12.5px; line-height: 1.55; max-width: 72ch; }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tile { min-width: 0; min-height: 112px; padding: 16px 16px 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; gap: 6px; }
.tile-label { margin: 0; color: var(--dim); font-size: 13px; }
.tile-value { margin: 0; font-size: 26px; font-weight: 620; line-height: 1.15; letter-spacing: -.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile-value small { font-size: 14px; color: var(--dim); font-weight: 500; letter-spacing: 0; }
.tile-note { margin: auto 0 0; color: var(--dim); font-size: 12.5px; line-height: 1.45; }
.meter { display: block; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--adm-chart); }
.meter-hot > span { background: var(--accent); }

/* ---- verdict: the first thing on the page -------------------------------- */
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; padding: 18px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--card); }
.verdict-blocked { border-color: var(--accent); box-shadow: inset 0 3px var(--accent); }
.verdict-degraded { border-color: rgba(176, 138, 74, .6); box-shadow: inset 0 3px var(--warn); }
.verdict-unknown { border-style: dashed; border-color: var(--faint); }
.verdict-offline { border-color: var(--faint); }
.verdict h2 { margin: 0; font-size: 20px; font-weight: 650; line-height: 1.25; }
.verdict p { margin: 2px 0 0; color: var(--dim); font-size: 13.5px; line-height: 1.5; }
.glyph-big { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; font-size: 22px; font-weight: 700; background: var(--card-hi); }

/* Severity: a glyph and a word, never colour alone. */
.sev { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); white-space: nowrap; }
.sev i { font-style: normal; width: 18px; height: 18px; display: inline-grid; place-items: center; border-radius: 4px; font-size: 11px; font-weight: 800; flex: none; }
.s-blocked i, .glyph-blocked { background: var(--accent); color: #1a1310; }
.s-degraded i, .glyph-degraded { background: var(--warn); color: #1a1310; }
.s-error i, .glyph-error { background: var(--bad); color: var(--ink); }
.s-healthy i, .glyph-healthy { background: var(--card-hi); color: var(--dim); border: 1px solid var(--line); }
.s-idle i { background: transparent; color: var(--dim); border: 1px solid var(--line); }
.s-unknown i, .glyph-unknown { background: transparent; color: var(--ink); border: 1px dashed var(--dim); }
.s-offline i, .glyph-offline { background: transparent; color: var(--dim); border: 1.5px solid var(--dim); border-radius: 50%; }
.s-hidden i, .s-unsupported i, .s-retention i { background: transparent; color: var(--dim); border: 1px dotted var(--faint); }
.s-hidden, .s-unsupported, .s-retention { color: var(--dim); }

/* ---- freshness strip ----------------------------------------------------- */
.sources { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.source { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); display: grid; gap: 4px; min-width: 0; }
.source-name { font-size: 13.5px; font-weight: 600; }
.source-age { font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
.source-ret { font-size: 12px; color: var(--dim); }

/* ---- timeline ------------------------------------------------------------ */
.tl { display: grid; gap: 4px; min-width: 0; }
.tl-axis, .tl-lane { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; align-items: center; }
.tl-axis-track { position: relative; height: 22px; color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.tl-axis-track span { position: absolute; top: 2px; transform: translateX(-50%); white-space: nowrap; }
.tl-axis-track span:first-child { transform: none; }
.tl-axis-track span:last-child { transform: translateX(-100%); }
.tl-name { font-size: 13px; line-height: 1.3; min-width: 0; }
.tl-name small { display: block; color: var(--dim); font-size: 11.5px; }
.tl-track { position: relative; height: 34px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.tl-seg { position: absolute; top: 50%; transform: translateY(-50%); }
.st-healthy { height: 6px; background: var(--lane-ok); }
.st-idle { height: 2px; background: var(--line); }
.st-degraded { height: 12px; background: var(--warn); }
.st-blocked { height: 20px; background: var(--accent); border-radius: 3px; }
.st-error { height: 14px; background: repeating-linear-gradient(90deg, var(--bad) 0 3px, transparent 3px 6px); }
.st-unknown { height: 100%; background: repeating-linear-gradient(135deg, rgba(109, 106, 100, .55) 0 4px, transparent 4px 9px); }
.st-offline { height: 14px; border: 1.5px solid var(--dim); border-radius: 7px; }
.st-retention { height: 0; border-top: 2px dotted var(--faint); }
.st-hidden { height: 100%; background: transparent; }
.tl-hidden-note, .tl-ret-note { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 10px; color: var(--dim); font-size: 12px; pointer-events: none; }
.tl-mark { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--ink); opacity: .55; }
.tl-now { position: absolute; top: 0; bottom: 0; right: 0; width: 2px; background: var(--adm-link); }
.tl-incidents { position: relative; height: 40px; }
.tl-inc { position: absolute; top: 4px; min-width: 32px; height: 32px; padding: 0 8px; transform: translateX(-50%); border-radius: 8px; border: 1px solid var(--line); background: var(--card-hi); color: var(--ink); font: inherit; font-size: 12px; font-weight: 650; cursor: pointer; white-space: nowrap; }
.tl-inc:hover { border-color: var(--accent-ed); }
.tl-inc[aria-current="true"] { border-color: var(--accent); background: var(--accent-in); box-shadow: 0 0 0 1px var(--accent); }
.tl-band { position: absolute; top: 0; bottom: 0; background: rgba(217, 119, 87, .07); border-left: 1px dashed var(--accent-ed); border-right: 1px dashed var(--accent-ed); pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--dim); font-size: 12px; margin-top: 8px; }
.legend > span { display: inline-flex; align-items: center; gap: 7px; }
.legend .sw { position: relative; width: 26px; height: 16px; border-radius: 3px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.legend .sw > b { position: absolute; left: 2px; right: 2px; top: 50%; transform: translateY(-50%); }
.legend .sw > .st-unknown { left: 0; right: 0; }
.tl-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; margin-top: 4px; }

/* ---- tables (admin.css .adm-table) --------------------------------------- */
.table-wrap { max-width: 100%; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: top; }
thead th { border-top: 0; color: var(--dim); font-size: 12px; font-weight: 560; padding-top: 4px; }
tbody th { font-weight: 560; }
.num { text-align: right; }
.dimtext { color: var(--dim); }
.mono { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }

/* ---- incident ------------------------------------------------------------ */
.inc-list { list-style: none; margin: 0; padding: 0; display: grid; }
.inc-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.inc-row:first-child { border-top: 0; padding-top: 2px; }
.inc-row p { margin: 0; }
.inc-title { font-size: 14.5px; font-weight: 600; }
.inc-meta { color: var(--dim); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.claims { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.claim { padding: 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); display: grid; gap: 8px; align-content: start; min-width: 0; }
.claim-fact { border-left: 0; box-shadow: inset 0 3px var(--dim); }
.claim-suspect { border-style: solid; box-shadow: inset 0 3px var(--warn); }
.claim-missing { border-style: dashed; }
.claim h3 { margin: 0; font-size: 14px; font-weight: 640; display: flex; gap: 8px; align-items: center; }
.claim ul { margin: 0; padding-left: 18px; display: grid; gap: 7px; font-size: 13.5px; line-height: 1.5; }
.claim .src { color: var(--dim); font-size: 12px; }
.certainty { display: inline-flex; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--ink); }
.cert-confirmed { border-color: var(--dim); }
.cert-suspected { border-color: var(--warn); }
.cert-unknown { border-style: dashed; }
.facts { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 18px; }
.facts div { display: grid; gap: 3px; min-width: 0; }
.facts dt { color: var(--dim); font-size: 12px; }
.facts dd { margin: 0; font-size: 14px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }

/* Waterfall: one row per stage; a missing receipt is a dashed empty bar with words. */
.wf { display: grid; gap: 6px; }
.wf-row { display: grid; grid-template-columns: 190px minmax(0, 1fr) 96px; gap: 12px; align-items: center; }
.wf-name { font-size: 13px; }
.wf-name small { display: block; color: var(--dim); font-size: 11.5px; }
.wf-track { position: relative; height: 22px; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; }
.wf-bar { position: absolute; top: 4px; bottom: 4px; min-width: 3px; border-radius: 3px; background: var(--adm-chart); }
.wf-late { background: var(--warn); }
.wf-stuck { background: var(--accent); }
.wf-missing { position: absolute; inset: 3px; border: 1px dashed var(--faint); border-radius: 3px; display: flex; align-items: center; padding-left: 8px; color: var(--dim); font-size: 11.5px; }
.wf-time { text-align: right; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.code { display: grid; gap: 8px; }
.code li { display: grid; gap: 2px; }
.view-toggle { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---- evidence ------------------------------------------------------------ */
pre.json { margin: 0; padding: 14px; max-height: 70vh; overflow: auto; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); font-family: var(--mono); font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.status-line { margin: 0; font-size: 13px; color: var(--ink); min-height: 1.4em; }

/* ---- phone width --------------------------------------------------------- */
@media (max-width: 899px) {
  .shell { display: block; }
  .top { position: sticky; top: 46px; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: rgba(14, 14, 17, .96); border-bottom: 1px solid var(--line); }
  .top p { margin: 0; flex: 1; min-width: 0; font-size: 15px; font-weight: 620; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 18px; cursor: pointer; }
  .side { position: fixed; z-index: 80; top: 0; left: 0; bottom: 0; width: min(320px, 86vw); transform: translateX(-102%); visibility: hidden; transition: transform .22s var(--ease), visibility 0s linear .22s; }
  .drawer-open .side { transform: none; visibility: visible; transition: transform .22s var(--ease); }
  .drawer-open .scrim { display: block; position: fixed; inset: 0; z-index: 75; background: rgba(0, 0, 0, .55); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .claims { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .proto { top: 0; font-size: 12px; }
  .top { top: 0; position: relative; }
  .main { padding-top: 16px; gap: 18px; }
  .pagehead h1 { font-size: 23px; }
  .panel { padding: 14px; }
  .tile { min-height: 100px; padding: 13px; }
  .tile-value { font-size: 21px; }
  .verdict { grid-template-columns: auto minmax(0, 1fr); padding: 14px; }
  .verdict > .btn { grid-column: 1 / -1; }
  /* Lanes: the name goes above its track so the track keeps the full width. */
  .tl-axis, .tl-lane { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .tl-axis .tl-name { display: none; }
  .tl-lane { margin-top: 6px; }
  .tl-name small { display: inline; margin-left: 6px; }
  .tl-incidents { margin-left: 0 !important; }
  .wf-row { grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; }
  .wf-track { grid-column: 1 / -1; grid-row: 2; }
  .seg span { padding: 0 10px; }
  .controls { padding: 12px; }
  /* Tables become one card per row, as admin.css does for campaigns. */
  .cards thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .cards, .cards tbody, .cards tr { display: block; }
  .cards tr { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .cards th, .cards td { display: block; border: 0; padding: 0; text-align: left; }
  .cards tbody th { grid-column: 1 / -1; font-size: 14.5px; }
  .cards td::before { content: attr(data-label); display: block; color: var(--dim); font-size: 11.5px; margin-bottom: 2px; }
  .cards td.wide { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { .side, .drawer-open .side { transition: none; } }
</style>
</head>
<body>
<div class="proto" role="note" id="proto">
  <span id="protoText"></span>
  <button type="button" id="langBtn"></button>
</div>
<div class="shell" id="shell">
  <div class="top">
    <button type="button" class="menu" id="menuBtn" aria-controls="side" aria-expanded="false"><span aria-hidden="true">☰</span><span class="vh" data-t="menu"></span></button>
    <p data-t="navHealth"></p>
  </div>
  <div class="scrim" id="scrim"></div>
  <aside class="side" id="side">
    <div class="brand"><small>Clawdline Cloud</small><strong data-t="ops"></strong></div>
    <nav class="nav" data-t-label="navLabel">
      <ul>
        <li><span class="off"><b data-t="navOverview"></b><small data-t="notInProto"></small></span></li>

const SCENARIO_ORDER = ["healthy", "stalled", "receipt", "source", "offline", "storm"]

/* ============================== state ===================================== */
const state = {
  scenario: "stalled", scope: "machine", windowMin: 60, live: true,
  loadedAt: Date.now(), pausedAt: null, selected: null, tableView: false, notice: null,
}
const sc = () => SCENARIOS[state.scenario]
const now = () => (state.live ? Date.now() : state.pausedAt)
const FIXTURE_CLOCK = Date.UTC(2026, 9, 20, 8, 45, 0) // what the fixture calls "loaded at"
const clock = (ms) => FIXTURE_CLOCK + (ms - state.loadedAt)
const hhmm = (ms, sec) => new Date(clock(ms)).toISOString().slice(11, sec ? 19 : 16)
const minAgo = (m) => state.loadedAt + m * 60000

function ago(sec) {
  sec = Math.max(0, Math.round(sec))
  if (sec < 90) return t("ago_s", { n: sec })
  if (sec < 5400) return t("ago_m", { n: Math.round(sec / 60) })
  return t("ago_h", { n: Math.round(sec / 3600) })
}
function ms(v) {
  if (v === null || v === undefined) return "—"
  return v < 1000 ? v + " ms" : (v / 1000).toFixed(v < 10000 ? 1 : 0) + " s"
}

/* What this scope may read. Machine lanes are owner data (a separate permission). */
function visible(lane) {
  if (state.scope === "cloud") return LANE_SOURCE[lane] !== "machine" && lane !== "browser"
  if (state.scope === "viewer") return lane === "browser"
  return true
}
function sourceVisible(src) {
  if (state.scope === "cloud") return src === "relay" || src === "collector"
  if (state.scope === "viewer") return src === "browser"
  return true
}

/* A source's receipt age now. A flowing source keeps receiving; a stuck one only ages. */
function sourceAge(src) {
  const f = sc().sources[src]
  const elapsed = (now() - state.loadedAt) / 1000
  if (f.stuck) return f.age + elapsed
  return (f.age + elapsed) % f.every
}
function freshness(src) {
  if (!sourceVisible(src)) return "hidden"
  const f = sc().sources[src]
  const age = sourceAge(src)
  if (f.stuck && f.offline) return "stale"
  if (f.stuck) return "unknown"
  return age <= f.every * 2 ? "fresh" : "stale"
}

/* Truth table (see the design document): the worst visible state wins, but unknown is never
   hidden behind healthy, and offline is its own answer rather than an error. */
const RANK = { blocked: 6, offline: 5, error: 4, degraded: 3, unknown: 2, unsupported: 1, idle: 0, healthy: 0, retention: 0, hidden: -1 }
function laneNow(lane) {
  if (!visible(lane)) return "hidden"
  const segs = sc().lanes[lane]
  const last = segs[segs.length - 1]
  if (LANE_SOURCE[lane] === "machine" && freshness("machine") === "unknown") return "unknown"
  return last.st
}
function verdict() {
  const states = LANES.map(laneNow)
  if (states.includes("blocked")) return "blocked"
  // Offline is decided by the relay's presence contract expiring, which every scope may see;
  // a direct-path close alone never makes a machine offline.
  if (sc().presence === "expired" || states.includes("offline")) return "offline"
  if (states.includes("error") || states.includes("degraded")) return "degraded"
  if (states.includes("unknown") || states.includes("unsupported")) return "unknown"
  if (["relay", "collector", "machine", "browser"].some((s) => sourceVisible(s) && freshness(s) !== "fresh" && freshness(s) !== "hidden")) return "unknown"
  return "healthy"
}
/* Evidence quality is the second dimension: how much of the window we could actually see. */
const Q_RANK = { complete: 0, no_requests: 0, partial: 1, unsupported: 2, not_collected: 3, stale: 4, forbidden: -1 }
function laneQuality(lane) {
  if (!visible(lane)) return "forbidden"
  const segs = laneSegments(lane).filter((x) => x.st !== "retention")
  const cur = segs[segs.length - 1]
  if (LANE_SOURCE[lane] === "machine" && sc().sources.machine.stuck) return "stale"
  if (cur.st === "unknown") return "not_collected"
  if (cur.st === "unsupported") return "unsupported"
  if (segs.some((x) => x.st === "unknown" || x.st === "unsupported")) return "partial"
  if (segs.every((x) => x.st === "idle")) return "no_requests"
  return "complete"
}
function overallQuality() {
  return LANES.map(laneQuality).filter((q) => q !== "forbidden").reduce((w, q) => (Q_RANK[q] > Q_RANK[w] ? q : w), "complete")
}
const Q_SEV = { complete: "healthy", no_requests: "idle", partial: "degraded", unsupported: "unsupported", not_collected: "unknown", stale: "unknown", forbidden: "hidden" }
const qual = (q) => `<span class="sev s-${Q_SEV[q]}"><i aria-hidden="true">${{ complete: "✓", no_requests: "–", partial: "◐", unsupported: "∅", not_collected: "?", stale: "⌛", forbidden: "⊘" }[q]}</i>${esc(t("q_" + q))}</span>`
const screenId = (id) => `<span class="certainty mono" style="margin-right:8px">${id}</span>`

const GLYPH = { healthy: "✓", idle: "–", degraded: "▲", error: "✕", blocked: "■", unknown: "?", offline: "○", hidden: "⊘", unsupported: "∅", retention: "…" }
const sev = (st, label) => `<span class="sev s-${st}"><i aria-hidden="true">${GLYPH[st] || "?"}</i>${esc(label ?? t("st_" + st))}</span>`

function activeIncidents() { return sc().incidents.filter((i) => i.end === 0) }
function windowStart() { return now() - state.windowMin * 60000 }

/* ============================== rendering ================================= */
const main = document.getElementById("main")

function render(focus) {
  document.documentElement.lang = locale === "zh-TW" ? "zh-Hant-TW" : "en"
  document.title = t("title") + " · " + t("proto")
  document.getElementById("protoText").textContent = t("proto")
  document.getElementById("langBtn").textContent = t("lang")
  document.querySelectorAll("[data-t]").forEach((n) => { n.textContent = t(n.dataset.t) })
  document.querySelectorAll("[data-t-label]").forEach((n) => n.setAttribute("aria-label", t(n.dataset.tLabel)))
  const [route, id] = location.hash.replace(/^#/, "").split("/")
  let inc = id ? sc().incidents.find((i) => i.id === id) : null
  if ((route === "incident" || route === "evidence" || route === "trace") && !inc) {
    state.notice = t("incidentGone")
    history.replaceState(null, "", "#overview")
    return render(focus)
  }
  if (inc) state.selected = inc.id
  const body = route === "incident" ? incidentView(inc) : route === "evidence" ? evidenceView(inc) : route === "trace" ? traceView(inc) : route === "monitoring" ? monitoringView() : overviewView()
  main.innerHTML = controls() + body
  bind()
  if (focus) { const h = main.querySelector("h1"); if (h) h.focus() }
}

function controls() {
  const opt = SCENARIO_ORDER.map((k) => `<option value="${k}"${k === state.scenario ? " selected" : ""}>${esc(t("sc_" + k))}</option>`).join("")

    `<label><input type="radio" name="${name}" value="${v}"${String(v) === String(cur) ? " checked" : ""}><span>${esc(label)}</span></label>`).join("")
  const liveText = state.live ? t("liveNote") : t("pausedNote", { time: hhmm(state.pausedAt, true), n: Math.floor((Date.now() - state.pausedAt) / 5000) })
  return `
  <section class="controls" aria-label="${esc(t("scenario"))}">
    <div class="controls-row">
      <label class="field"><span>${esc(t("scenario"))}</span><select id="scenario">${opt}</select></label>
      <fieldset class="field"><legend>${esc(t("scope"))}</legend><div class="seg">${radios("scope", [["cloud", t("scopeCloud")], ["machine", t("scopeMachine")], ["viewer", t("scopeViewer")]], state.scope)}</div></fieldset>
      <fieldset class="field"><legend>${esc(t("window"))}</legend><div class="seg">${radios("win", [[15, t("w15")], [60, t("w60")], [360, t("w360")]], state.windowMin)}</div></fieldset>
      <button type="button" class="btn" id="liveBtn" aria-pressed="${!state.live}">${state.live ? "❚❚ " + esc(t("pause")) : "▶ " + esc(t("resume"))}</button>
    </div>
    <p class="live-note" id="liveNote" aria-live="polite"><strong>${esc(state.live ? t("live") : t("paused"))}</strong> · ${esc(liveText)}</p>
    ${state.notice ? `<p class="notice" role="status">${esc(state.notice)}</p>` : ""}
  </section>`
}

function overviewView() {
  const v = verdict()
  const act = activeIncidents()[0]
  const tot = sc().totals
  const vText = { healthy: t("v_healthy"), blocked: t("v_blocked"), degraded: t("v_degraded"), unknown: t("v_unknown"), offline: t("v_offline") }[v]
  const since = act ? t("v_since", { time: hhmm(minAgo(act.start)), ago: t("agoWord", { t: ago((now() - minAgo(act.start)) / 1000) }) }) : t("v_none")
  return `
  <div class="pagehead">
    <p class="sub">${screenId("M01")}</p>
    <h1 tabindex="-1">${esc(t("title"))}</h1>
    <p class="sub">${esc(t("lead"))}</p>
  </div>
  <section class="verdict verdict-${v}" aria-labelledby="vh">
    <div class="glyph-big glyph-${v === "healthy" ? "healthy" : v}" aria-hidden="true">${GLYPH[v]}</div>
    <div><h2 id="vh">${esc(vText)}</h2><p>${act ? esc(L(act.title)) + " · " : ""}${esc(since)}</p>
      <p>${esc(t("outcome"))}: ${sev(v === "healthy" ? "healthy" : v)} · ${esc(t("quality"))}: ${qual(overallQuality())}${LANES.some((l) => !visible(l)) ? " + " + qual("forbidden") : ""} · <a href="#monitoring">${esc(t("openMonitoring"))} (M06)</a></p>
      <p>${esc(t("qualityNote"))}</p></div>
    ${act ? `<a class="btn" href="#incident/${act.id}">${esc(t("v_open"))} →</a>` : ""}
  </section>
  ${tiles(act, tot)}
  ${freshnessStrip()}
  ${timeline()}
  ${incidentList()}
  ${segmentTable()}`
}

function tiles(act, tot) {
  const q = sc().queue
  const machineOk = sourceVisible("machine")
  const qHot = q && q.used / q.limit >= 0.75
  const qTile = !machineOk
    ? `<p class="tile-value"><small>${esc(t("st_hidden"))}</small></p><p class="tile-note">${esc(t("t_hiddenNote"))}</p>`
    : !q ? `<p class="tile-value">${sev("unknown")}</p><p class="tile-note">${esc(t("f_never"))}</p>`
    : `<p class="tile-value">${q.used}<small> / ${q.limit}</small></p>
       <span class="meter${qHot ? " meter-hot" : ""}" aria-hidden="true"><span style="width:${(q.used / q.limit) * 100}%"></span></span>
       <p class="tile-note">${esc(t("t_queueNote", { used: q.used, limit: q.limit, age: ms(q.oldest * 1000) }))}${q.asOf ? " · " + esc(t("agoWord", { t: ago(-q.asOf * 60) })) : ""}</p>`
  const rate = tot.n ? ((tot.bad / tot.n) * 100).toFixed(tot.bad / tot.n < 0.1 ? 1 : 0) + "%" : "—"
  const lat = tot.n >= 20 ? t("t_latNote", { p95: ms(tot.p95), p99: tot.p99 ? ms(tot.p99) : "—", n: tot.n }) : t("t_fewSamples", { n: tot.n })
  return `
  <section class="section" aria-label="${esc(t("segHealth"))}">
    <div class="tiles">
      <div class="tile"><p class="tile-label">${esc(t("t_incident"))}</p>

/* Segments of a lane clipped to the window, with retention and permission applied. */
function laneSegments(lane) {
  const start = windowStart(), end = now()
  if (!visible(lane)) return [{ a: start, b: end, st: "hidden" }]
  const retFrom = end - RETENTION_MIN[LANE_SOURCE[lane]] * 60000
  const out = []
  if (retFrom > start) out.push({ a: start, b: retFrom, st: "retention" })
  let cursor = Math.max(start, retFrom)
  for (const s of sc().lanes[lane]) {
    let a = minAgo(s.s), b = s.e === 0 ? end : minAgo(s.e)
    a = Math.max(a, cursor); b = Math.min(b, end)
    if (b <= a) continue
    if (a > cursor) out.push({ a: cursor, b: a, st: "unknown" })
    let st = s.st
    if (LANE_SOURCE[lane] === "machine" && freshness("machine") === "unknown" && s.e === 0 && st !== "unknown") st = "unknown"
    out.push({ a, b, st }); cursor = b
  }
  if (cursor < end) out.push({ a: cursor, b: end, st: "unknown" })
  return out
}
const pct = (x) => (((x - windowStart()) / (now() - windowStart())) * 100).toFixed(3)

function timeline() {
  const start = windowStart(), end = now()
  const ticks = 4
  const axis = Array.from({ length: ticks + 1 }, (_, i) => {
    const x = start + ((end - start) * i) / ticks
    return `<span style="left:${(i / ticks) * 100}%">${i === ticks ? esc(t("tlNow")) : hhmm(x)}</span>`
  }).join("")
  const sel = state.selected
  const incs = sc().incidents.filter((i) => minAgo(i.start) < end && (i.end === 0 || minAgo(i.end) > start))
  const bands = incs.map((i) => {
    const a = Math.max(minAgo(i.start), start), b = i.end === 0 ? end : Math.min(minAgo(i.end), end)
    return `<div class="tl-band" style="left:${pct(a)}%;width:${(pct(b) - pct(a)).toFixed(3)}%"></div>`
  }).join("")
  if (state.tableView) return timelineTable(start, end, incs)
  const lanes = LANES.map((lane) => {
    const segs = laneSegments(lane)
    const summary = segs.map((s) => `${t("st_" + s.st)} ${hhmm(s.a)}–${hhmm(s.b)}`).join("; ")
    const inner = segs.map((s) => `<span class="tl-seg st-${s.st}" style="left:${pct(s.a)}%;width:${(pct(s.b) - pct(s.a)).toFixed(3)}%"></span>`).join("")
    const hidden = segs.length === 1 && segs[0].st === "hidden" ? `<span class="tl-hidden-note">⊘ ${esc(t("st_hidden"))}</span>` : ""
    const ret = segs.find((s) => s.st === "retention") ? `<span class="tl-ret-note" style="width:${pct(segs.find((s) => s.st === "retention").b)}%">${esc(t("st_retention"))}</span>` : ""
    const marks = visible(lane) ? sc().marks.filter((m) => m.lane === lane && minAgo(m.t) >= start).map((m) => `<span class="tl-mark" style="left:${pct(minAgo(m.t))}%"></span>`).join("") : ""
    return `<div class="tl-lane"><div class="tl-name">${esc(t("lane_" + lane))}<small>${esc(t("lane_" + lane + "_s"))}</small></div>
      <div class="tl-track" role="img" aria-label="${esc(t("tlSummary", { lane: t("lane_" + lane), list: summary }))}">${bands}${inner}${marks}${hidden}${ret}${state.live ? '<span class="tl-now"></span>' : ""}</div></div>`
  }).join("")
  const buttons = incs.map((i) => {
    const x = Math.max(minAgo(i.start), start)
    return `<button type="button" class="tl-inc" data-inc="${i.id}" style="left:${pct(x)}%" aria-current="${i.id === sel}" aria-label="${esc(L(i.title))}, ${esc(t("v_since", { time: hhmm(minAgo(i.start)), ago: ago((end - minAgo(i.start)) / 1000) }))}">${GLYPH[i.sev]} ${esc(i.id)}</button>`
  }).join("")
  const legend = ["healthy", "idle", "degraded", "error", "blocked", "offline", "unknown", "retention"].map((st) =>
    `<span><span class="sw"><b class="st-${st}"></b></span>${esc(t("st_" + st))}</span>`).join("")
  return `
  <section class="section panel" aria-labelledby="tlh">
    <div class="panel-head"><h2 class="h3" id="tlh">${esc(t("timeline"))}</h2>
      <span class="dimtext" style="font-size:12.5px">${esc(t("tlRange", { from: hhmm(start), to: hhmm(end) }))} · ${esc(state.live ? t("live") : t("paused"))}</span></div>
    <div class="tl">
      <div class="tl-axis"><div class="tl-name"></div><div class="tl-axis-track" aria-hidden="true">${axis}</div></div>
      ${lanes}
      ${buttons ? `<div class="tl-axis"><div class="tl-name dimtext" style="font-size:12px">${esc(t("incidents"))}</div><div class="tl-incidents">${buttons}</div></div>` : ""}
    </div>
    <div class="legend" aria-label="${esc(t("tlLegend"))}">${legend}</div>
    <div class="tl-foot"><p class="fine">${esc(t("gapNote"))}</p>
      <button type="button" class="btn btn-small" id="viewBtn">${esc(t("tableView"))}</button></div>

  <div class="actions"><button type="button" class="btn" id="copyBtn">${esc(t("copy"))}</button><button type="button" class="btn" id="dlBtn">${esc(t("download"))}</button>
    <p class="status-line" id="copyStatus" role="status"></p></div>
  <p class="fine">${esc(t("evidenceNote"))}</p>
  <pre class="json" id="json" tabindex="0" aria-label="JSON">${esc(json)}</pre>
  <div class="actions"><a class="btn" href="#incident/${i.id}">← ${esc(i.id)}</a></div>`
}

/* ============================== interaction =============================== */
function bind() {
  const q = (id) => document.getElementById(id)
  q("scenario").onchange = (e) => {
    state.scenario = e.target.value
    state.loadedAt = Date.now(); if (!state.live) state.pausedAt = state.loadedAt
    state.windowMin = 60
    state.selected = activeIncidents()[0]?.id ?? null
    state.notice = t("scenarioReset")
    const [route] = location.hash.replace(/^#/, "").split("/")
    if (route === "incident" || route === "evidence" || route === "trace") {
      history.replaceState(null, "", state.selected ? `#${route}/${state.selected}` : "#overview")
    }
    render(); q("scenario")?.focus()
  }
  document.querySelectorAll('input[name="scope"]').forEach((r) => (r.onchange = () => { state.scope = r.value; state.notice = null; render(); document.querySelector(`input[name="scope"][value="${r.value}"]`).focus() }))
  document.querySelectorAll('input[name="win"]').forEach((r) => (r.onchange = () => { state.windowMin = Number(r.value); state.notice = null; render(); document.querySelector(`input[name="win"][value="${r.value}"]`).focus() }))
  q("liveBtn").onclick = () => {
    state.live = !state.live
    state.pausedAt = state.live ? null : Date.now()
    render(); q("liveBtn").focus()
  }
  const vb = q("viewBtn"); if (vb) vb.onclick = () => { state.tableView = !state.tableView; render(); q("viewBtn").focus() }
  document.querySelectorAll(".tl-inc").forEach((b) => (b.onclick = () => { state.selected = b.dataset.inc; location.hash = "#incident/" + b.dataset.inc }))
  const cb = q("copyBtn")
  if (cb) {
    const pre = q("json")
    cb.onclick = async () => {
      try { await navigator.clipboard.writeText(pre.textContent); q("copyStatus").textContent = t("copied") }
      catch { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); q("copyStatus").textContent = t("copyFailed") }
    }
    q("dlBtn").onclick = () => {
      const url = URL.createObjectURL(new Blob([pre.textContent], { type: "application/json" }))
      const a = document.createElement("a"); a.href = url; a.download = "connection-evidence-illustrative.json"
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000)
      q("copyStatus").textContent = t("downloaded")
    }
  }
}

document.getElementById("langBtn").onclick = () => { locale = locale === "zh-TW" ? "en" : "zh-TW"; render(); document.getElementById("langBtn").focus() }
const shell = document.getElementById("shell"), menuBtn = document.getElementById("menuBtn")
const drawer = (open) => { shell.classList.toggle("drawer-open", open); menuBtn.setAttribute("aria-expanded", String(open)); if (open) document.querySelector(".nav a").focus(); else menuBtn.focus() }
menuBtn.onclick = () => drawer(true)
document.getElementById("scrim").onclick = () => drawer(false)
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && shell.classList.contains("drawer-open")) drawer(false) })
window.addEventListener("hashchange", () => { state.notice = null; shell.classList.remove("drawer-open"); render(true) })

// Live mode redraws only the parts that age, without moving focus or the scroll position.
setInterval(() => {
  if (!state.live) { const n = document.getElementById("liveNote"); if (n) n.innerHTML = `<strong>${esc(t("paused"))}</strong> · ${esc(t("pausedNote", { time: hhmm(state.pausedAt, true), n: Math.floor((Date.now() - state.pausedAt) / 5000) }))}`; return }
  const active = document.activeElement, id = active && active.id, inc = active && active.dataset && active.dataset.inc
  const y = window.scrollY
  render()
  window.scrollTo(0, y)
  const back = id ? document.getElementById(id) : inc ? document.querySelector(`.tl-inc[data-inc="${inc}"]`) : null
  if (back) back.focus()
}, 5000)

state.selected = activeIncidents()[0]?.id ?? null
if (!location.hash) history.replaceState(null, "", "#overview")
render()
</script>
</body>
</html>
