<text x="86" y="257" font-size="23" fill="#e9edf5" font-weight="600" text-anchor="start">Codex Session</text>
<text x="86" y="292" font-size="16" fill="#b2c2d9" font-weight="400" text-anchor="start">Plans work · owns the delivery</text>
<text x="72" y="371" font-size="17" fill="#b2c2d9" font-weight="400" text-anchor="start">Project + Session discovery</text>
<rect x="812" y="156" width="340" height="257" rx="16" fill="#1b2534" stroke="#40516a"/>
<text x="836" y="196" font-size="23" fill="#e9edf5" font-weight="600" text-anchor="start">Linux · paired machine</text>
<rect x="832" y="220" width="300" height="112" rx="10" fill="#101a29" stroke="#596f8f"/>
<text x="850" y="257" font-size="23" fill="#e9edf5" font-weight="600" text-anchor="start">Claude Code Session</text>
<text x="850" y="292" font-size="16" fill="#b2c2d9" font-weight="400" text-anchor="start">Runs work in its own Project</text>
<text x="836" y="371" font-size="17" fill="#b2c2d9" font-weight="400" text-anchor="start">Local Projects · runtime · keys</text>
<rect x="440" y="197" width="320" height="171" rx="30" fill="#172f3c" stroke="#70b7c7"/>
<text x="600" y="243" font-size="25" fill="#e9edf5" font-weight="650" text-anchor="middle">Clawdline Cloud</text>
<text x="600" y="286" font-size="21" fill="#98e3cc" font-weight="400" text-anchor="middle">End-to-end encrypted</text>
<text x="600" y="323" font-size="17" fill="#b2c2d9" font-weight="400" text-anchor="middle">Routes signed ciphertext only</text>
<path d="M394 269H432" stroke="#91c9ff" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M768 269H806" stroke="#91c9ff" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M64 450H1136" stroke="#33465f"/>
<text x="60" y="495" font-size="23" fill="#98e3cc" font-weight="600" text-anchor="start">1  Discover</text>
<text x="320" y="495" font-size="21" fill="#e9edf5" font-weight="400" text-anchor="start">Find remote Project IDs, Session status and capabilities</text>
<text x="60" y="570" font-size="23" fill="#98e3cc" font-weight="600" text-anchor="start">2  Dispatch + talk</text>
<text x="320" y="570" font-size="21" fill="#e9edf5" font-weight="400" text-anchor="start">Start a remote Session or message an existing one</text>
<text x="60" y="645" font-size="23" fill="#98e3cc" font-weight="600" text-anchor="start">3  Return + continue</text>
<text x="320" y="645" font-size="21" fill="#e9edf5" font-weight="400" text-anchor="start">Results wake the source; its Agent reads and resumes</text>
<text x="60" y="718" font-size="19" fill="#bac8dc" font-weight="400" text-anchor="start">Reciprocal pairing + permission · Both machines online · Revocable</text>
