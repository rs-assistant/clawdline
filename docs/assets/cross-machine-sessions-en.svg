<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">Sessions that work across machines</title>
<desc id="desc">Mac · source machine. Codex Session. Plans work · owns the delivery. Project + Session discovery. Clawdline Cloud. End-to-end encrypted. Routes signed ciphertext only. Linux · paired machine. Claude Code Session. Runs work in its own Project. Local Projects · runtime · keys. 1  Discover. Find remote Project IDs, Session status and capabilities. 2  Dispatch + talk. Start a remote Session or message an existing one. 3  Return + continue. Results wake the source; its Agent reads and resumes. Reciprocal pairing + permission · Both machines online · Revocable. Code, execution and content keys stay on each machine</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#91c9ff" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="790" rx="24" fill="#10151e"/>
<g font-family="system-ui, -apple-system, sans-serif">
<text x="48" y="64" font-size="34" fill="#e9edf5" font-weight="700" text-anchor="start">Sessions that work across machines</text>
<text x="48" y="104" font-size="21" fill="#abb9cc" font-weight="400" text-anchor="start">Let Agents on your Mac and Linux work together</text>
<rect x="48" y="156" width="340" height="257" rx="16" fill="#1b2534" stroke="#40516a"/>
<text x="72" y="196" font-size="23" fill="#e9edf5" font-weight="600" text-anchor="start">Mac · source machine</text>
