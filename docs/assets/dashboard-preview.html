<!doctype html><html lang="en"><meta charset="utf-8"><title>Sample dashboard design</title><style>*{box-sizing:border-box}body{margin:0;width:720px;height:240px;background:#f4f3ee;color:#303c36;font:14px -apple-system,BlinkMacSystemFont,sans-serif;display:flex}aside{width:132px;padding:22px;background:#e3e8e1}aside b{display:block;margin-bottom:28px}aside p{font-size:11px;color:#617368;margin:17px 0}main{flex:1;padding:22px 26px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}button{background:#476857;border:0;border-radius:5px;padding:7px 10px;color:white;font:10px sans-serif}.cards{display:flex;gap:12px;margin-top:24px}.card{flex:1;background:white;border:1px solid #d8dfd5;border-radius:7px;padding:15px}.card b{font-size:14px}.card p{font-size:10px;color:#758177;margin:10px 0 15px}.track{height:5px;background:#e4e9e2;border-radius:3px}.track i{display:block;height:5px;background:#86a58e;border-radius:3px}</style><aside><b>Workspace</b><p id="nav1"></p><p id="nav2"></p><p id="nav3"></p></aside><main><header><h1 id="title"></h1><button id="add"></button></header><div class="cards" id="cards"></div></main><script>const zh=new URLSearchParams(location.search).get('lang')==='zh-Hant';document.documentElement.lang=zh?'zh-Hant-TW':'en';const t=zh?['專案總覽','新增專案','專案','訊息','設定','官網改版','行動版介面','說明文件','進行中']:['Your projects','New project','Projects','Messages','Settings','Website refresh','Mobile layout','Documentation','In progress'];for(const [id,index] of [['title',0],['add',1],['nav1',2],['nav2',3],['nav3',4]])document.getElementById(id).textContent=t[index];document.getElementById('cards').innerHTML=[5,6,7].map((n,i)=>`<div class="card"><b>${t[n]}</b><p>${t[8]}</p><div class="track"><i style="width:${[75,45,60][i]}%"></i></div></div>`).join('')</script></html>
