<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clawdline image feedback walkthrough</title>
<style>
*{box-sizing:border-box}body{margin:0;width:390px;height:560px;background:#101014;color:#eeeef0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{height:55px;padding:16px 20px;border-bottom:1px solid #303036;display:flex;align-items:center;justify-content:space-between}.top strong{font-size:18px}.tag{font-size:11px;color:#aaaab4}.story{height:73px;padding:14px 20px;background:#1c1c23}.story small{color:#eaa68e;font-size:11px}.story h1{font-size:17px;margin:4px 0 0}.content{padding:18px 16px}.machine{font-size:12px;color:#a2a2af;margin:4px 0 9px}.row{border:1px solid #34343e;border-radius:10px;background:#1a1a21;padding:13px;margin-bottom:10px}.selected{border-color:#d18c73;background:#2b2222}.row strong{font-size:14px}.row p{margin:5px 0 0;color:#aaaab5;font-size:12px}.waiting{color:#efa182!important}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#d99479;margin-right:6px}.session{padding-bottom:10px;border-bottom:1px solid #303038;margin-bottom:16px;color:#d7d7df}.session span{color:#a3a3af;font-size:12px;margin-right:17px}.agent{color:#a7a7b2;font-size:10px;letter-spacing:.5px}.message{margin:6px 0 12px;font-size:14px}.preview{width:226px;height:131px;border:1px solid #3e414b;border-radius:7px;background:#f5f4f0;overflow:hidden;color:#333743}.previewbar{height:21px;border-bottom:1px solid #dddedb;padding:5px 9px;font-size:7px;color:#777}.design{display:flex;height:110px}.sidebar{width:46px;background:#e6e7e2;padding:12px 7px}.line{height:4px;border-radius:2px;background:#bbc2c5;margin-bottom:8px}.canvas{padding:10px 12px;flex:1}.canvas b{font-size:10px}.action{float:right;padding:2px 5px;background:#596f67;color:white;border-radius:3px;font-size:6px}.cards{display:flex;gap:6px;margin:9px 0}.card{height:31px;flex:1;background:white;border:1px solid #dfdfdc;border-radius:4px;padding:6px}.card i{display:block;width:15px;height:4px;background:#bfcdca;margin-bottom:6px}.card em{display:block;width:24px;height:6px;background:#596f67;border-radius:2px}.chart{display:flex;height:27px;gap:7px;align-items:flex-end;border-bottom:1px solid #c8cfca}.chart i{width:13px;background:#a8beb3;border-radius:2px 2px 0 0}.filename{font-size:10px;color:#9696a3;margin-top:6px}.reply{margin:16px 0 0 auto;max-width:270px;background:#303a36;border:1px solid #4c6557;border-radius:9px;padding:10px 12px;font-size:13px}.sent{font-size:10px;color:#a1b7a7;text-align:right;margin-top:5px}.composer{position:absolute;top:480px;left:16px;width:358px;height:38px;border:1px solid #3b3b46;border-radius:8px;padding:10px 12px;color:#858591;font-size:11px}.composer b{float:right;color:#e9a68d}.footer{position:absolute;top:530px;width:390px;display:flex;justify-content:space-between;padding:0 20px;color:#8d8d99;font-size:10px}.progress{display:flex;gap:5px}.progress i{width:22px;height:3px;background:#3c3c48;margin-top:6px}.progress i.on{background:#e0a18a}
</style>
<header class="top"><strong>clawdline</strong><span class="tag" id="example"></span></header>
<section class="story"><small id="step"></small><h1 id="heading"></h1></section>
<main class="content" id="content"></main>
<footer class="footer"><span id="caption"></span><span class="progress" id="progress"></span></footer>
<script>
const params=new URLSearchParams(location.search),zh=params.get('lang')==='zh-Hant',step=Number(params.get('step')||0);
document.documentElement.lang=zh?'zh-Hant-TW':'en';
const text=zh?{example:'操作示意',steps:['開啟等待你回覆的 Session','查看 Agent 傳來的設計圖','直接回覆修改意見'],title:'調整工作面板',wait:'等待你回覆',working:'修正登入流程',status:'工作中',message:'這是更新後的介面，請幫我看看。',reply:'請把按鈕加大一點。',sent:'已傳送',composer:'回覆 Codex…',send:'傳送',caption:'在手機查看圖片，接著給 Agent 意見。'}:{example:'Illustrated example',steps:['Open the Session waiting for you','See the design your Agent sent','Reply with your feedback'],title:'Update the dashboard',wait:'Waiting for you',working:'Fix sign-in flow',status:'Working',message:'Here is the updated design for your review.',reply:'Please make the button larger.',sent:'Sent',composer:'Reply to Codex…',send:'Send',caption:'See the image on your phone. Give feedback.'};
document.querySelector('#example').textContent=text.example;document.querySelector('#step').textContent=`${step+1} / 3`;document.querySelector('#heading').textContent=text.steps[step];document.querySelector('#caption').textContent=text.caption;document.querySelector('#progress').innerHTML=[0,1,2].map(i=>`<i class="${i===step?'on':''}"></i>`).join('');
const preview=`<div class="preview"><div class="previewbar">${zh?'工作面板 · 介面預覽':'Dashboard · UI preview'}</div><div class="design"><aside class="sidebar"><div class="line"></div><div class="line"></div><div class="line"></div></aside><div class="canvas"><span class="action">${zh?'新增':'Add'}</span><b>${zh?'專案總覽':'Projects'}</b><div class="cards">${[0,1,2].map(()=>'<div class="card"><i></i><em></em></div>').join('')}</div><div class="chart">${[12,19,15,23,18,26,22,27].map(h=>`<i style="height:${h}px"></i>`).join('')}</div></div></div></div><div class="filename">dashboard-preview.png</div>`;
document.querySelector('#content').innerHTML=step===0?`<div class="machine">Studio Mac</div><div class="row selected"><strong>${text.title}</strong><p>Codex</p><p class="waiting"><span class="dot"></span>${text.wait}</p></div><div class="row"><strong>${text.working}</strong><p>Claude Code · ${text.status}</p></div><div class="machine" style="margin-top:22px">Build Linux</div><div class="row"><strong>${zh?'檢查測試結果':'Review test results'}</strong><p>Codex · ${text.status}</p></div>`:`<div class="session"><span>‹ Sessions</span><strong>${text.title}</strong></div><div class="agent">CODEX</div><p class="message">${text.message}</p>${preview}${step===2?`<div class="reply">${text.reply}</div><div class="sent">${text.sent}</div>`:''}<div class="composer">${text.composer}<b>${text.send}</b></div>`;
</script>
</html>
